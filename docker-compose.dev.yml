version: '3.8'
services:
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/app/logs:ro
    command: ["filebeat", "-e", "-strict.perms=false"]
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    ports:
      - "5044:5044"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - elk

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
    volumes:
      - ./elasticsearch/templates:/usr/share/elasticsearch/config/templates
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENROLLMENT_ENABLED=false
      - XPACK_SECURITY_TRANSPORT_SSL_ENABLED=false
      - XPACK_SECURITY_HTTP_SSL_ENABLED=false
      - SERVER_SSL_ENABLED=false
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
    networks:
      - elk

  init-template:
    image: curlimages/curl:latest
    depends_on:
      - elasticsearch
    volumes:
      - ./elasticsearch/templates:/templates:ro
      - ./elasticsearch/register-templates.sh:/register-templates.sh:ro
    entrypoint: [ "sh", "/register-templates.sh" ]
    networks:
      - elk

networks:
  elk:
    driver: bridge

volumes:
  elasticsearch-data:
