app:
  cookie:
    secure: true
    sameSite: None
    domain:
    frontend-origin: https://localhost:3000

server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379

    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: http://localhost:9200
    ssl:
      verification-mode: none

logging:
  level:
    com.ndgl.spotfinder: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE

elasticsearch:
  host: localhost
  port: 9200
  enabled: false