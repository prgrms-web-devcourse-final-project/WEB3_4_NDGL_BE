app:
  cookie:
    secure: true
    sameSite: None
    domain:
    frontend-origin: https://www.ndgl.shop

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://ndgl_mysql_dev:3306/ndgl_prod?serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: redis_1
      port: 6379

logging:
  level:
    com.ndgl.spotfinder: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO
    org.springframework.transaction.interceptor: INFO