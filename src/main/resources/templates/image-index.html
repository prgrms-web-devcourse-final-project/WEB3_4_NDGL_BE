<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이미지 관리 예제</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding-top: 60px;
            max-width: 1000px;
        }
        .header {
            margin-bottom: 40px;
            border-bottom: 1px solid #e3e6f0;
            padding-bottom: 20px;
        }
        .card {
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.3rem 2rem 0 rgba(58, 59, 69, 0.2);
        }
        .card-header {
            background-color: #4e73df;
            color: white;
            font-weight: bold;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
            transform: translateY(-2px);
        }
        .btn-outline-primary {
            color: #4e73df;
            border-color: #4e73df;
            transition: all 0.2s;
        }
        .btn-outline-primary:hover {
            background-color: #4e73df;
            color: white;
        }
        .feature-icon {
            font-size: 1.5rem;
            margin-right: 10px;
            color: #4e73df;
        }
        .hero-section {
            background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
            color: white;
            padding: 50px 0;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header d-flex justify-content-between align-items-center">
            <h1 class="fw-bold text-dark">이미지 관리 시스템</h1>
            <a href="/view-example/images/post-upload" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-lg me-2"></i> 새 글 작성하기
            </a>
        </div>
        
        <div class="hero-section p-4 p-md-5 mb-4 text-center">
            <div class="hero-title">쉽고 빠른 이미지 관리</div>
            <p class="lead mb-4">여러분의 이미지를 효율적으로 관리하고 공유하세요.</p>
            <a href="/view-example/images/post-upload" class="btn btn-light btn-lg px-4 gap-3">
                <i class="bi bi-pencil"></i> 지금 시작하기
            </a>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-image me-2"></i> 이미지 업로드
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-3">다중 이미지 업로드</h5>
                        <p class="card-text text-muted mb-4">드래그 앤 드롭으로 간편하게 여러 이미지를 한 번에 업로드할 수 있습니다.</p>
                        <div class="mb-3">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-check-circle-fill feature-icon"></i>
                                <span>최대 10개 이미지 동시 업로드</span>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-check-circle-fill feature-icon"></i>
                                <span>드래그 앤 드롭 지원</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-check-circle-fill feature-icon"></i>
                                <span>미리보기 기능</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-top-0">
                        <a href="/view-example/images/post-upload" class="btn btn-outline-primary w-100">
                            이미지 업로드 시작하기
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-save me-2"></i> 임시 저장 기능
                    </div>
                    <div class="card-body">
                        <h5 class="card-title mb-3">자동 저장으로 안전하게</h5>
                        <p class="card-text text-muted mb-4">작업 중인 내용이 자동으로 저장되어 데이터 손실 걱정이 없습니다.</p>
                        <div class="mb-3">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-check-circle-fill feature-icon"></i>
                                <span>30초마다 자동 저장</span>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-check-circle-fill feature-icon"></i>
                                <span>작업 이어서 하기</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-check-circle-fill feature-icon"></i>
                                <span>임시글 관리</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-top-0">
                        <a href="/view-example/images/post-upload" class="btn btn-outline-primary w-100">
                            새 글 작성하기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
