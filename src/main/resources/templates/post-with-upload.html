<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포스트 작성하기</title>
    <!-- Toss UI CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toss/toss-ui@latest/dist/toss-ui.css">
    <!-- EasyMDE 마크다운 에디터 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Toss UI 기반 스타일링 */
        :root {
            --toss-primary: #3182ce;
            --toss-radius: 12px;
            --toss-border-color: #edf2f7;
            --toss-bg-light: #f9fafc;
            --toss-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --toss-font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            font-family: var(--toss-font);
            margin: 0;
            padding: 0;
            background-color: var(--toss-bg-light);
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 24px;
            background-color: white;
            border-radius: var(--toss-radius);
            box-shadow: var(--toss-shadow);
        }

        .toss-card {
            padding: 24px;
            border-radius: var(--toss-radius);
            border: 1px solid var(--toss-border-color);
            margin-bottom: 24px;
        }

        .toss-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background-color: rgba(49, 130, 206, 0.1);
            color: var(--toss-primary);
            margin-right: 8px;
        }

        .toss-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #dfe3e8;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s;
        }

        .toss-input:focus {
            outline: none;
            border-color: var(--toss-primary);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        .toss-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .toss-btn-primary {
            background-color: var(--toss-primary);
            color: white;
        }

        .toss-btn-primary:hover {
            background-color: #2b6cb0;
        }

        .toss-btn-secondary {
            background-color: #f7fafc;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }

        .toss-btn-secondary:hover {
            background-color: #edf2f7;
        }

        .toss-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toss-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 15px;
            color: #4a5568;
        }

        .toss-section {
            margin-bottom: 24px;
        }

        .toss-section-title {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
        }

        .toss-page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a202c;
        }

        /* 썸네일 관련 스타일 */
        .thumbnail-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        #thumbnail-preview {
            width: 140px !important;
            height: 140px !important;
            background-color: #f5f5f5;
            border-radius: 10px;
            overflow: hidden !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            position: relative !important;
            box-sizing: content-box !important;
            min-width: 140px !important;
            min-height: 140px !important;
            max-width: 140px !important;
            max-height: 140px !important;
            transition: all 0.2s ease;
        }

        #thumbnail-preview.has-image {
            border-color: var(--toss-primary);
        }

        /* 썸네일 이미지 래퍼 */
        .thumbnail-img-wrapper {
            width: 140px !important;
            height: 140px !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            overflow: hidden !important;
        }

        #thumbnail-preview img,
        .thumbnail-img-wrapper img {
            width: 140px !important;
            height: 140px !important;
            object-fit: cover !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            min-width: 140px !important;
            min-height: 140px !important;
            max-width: 140px !important;
            max-height: 140px !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
        }

        #thumbnail-preview .no-thumbnail {
            color: #888;
            text-align: center;
            padding: 16px;
            font-size: 14px;
            max-width: 100%;
        }

        #thumbnail-status {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* 이미지 갤러리 스타일 */
        .image-gallery {
            position: relative;
            width: 100%;
            margin: 16px 0 24px;
            display: none;
        }

        .image-gallery.has-images {
            display: block;
        }

        .gallery-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            scroll-behavior: smooth;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
            padding: 0 10px;
        }

        .gallery-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .gallery-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .gallery-scroller {
            display: flex;
            gap: 15px;
            padding: 5px 0;
        }

        .gallery-item {
            display: inline-block;
            width: 120px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            border: 2px solid #e0e0e0;
            box-sizing: border-box;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .gallery-item.is-thumbnail {
            border-color: var(--toss-primary);
            box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.3);
        }

        .gallery-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 갤러리 화살표 버튼 */
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: white;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            color: #333;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .gallery-arrow-left {
            left: 0;
        }

        .gallery-arrow-right {
            right: 0;
        }

        .gallery-arrow:hover {
            background-color: var(--toss-primary);
            color: white;
            border-color: var(--toss-primary);
        }

        .gallery-arrow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #f5f5f5;
            color: #bdbdbd;
        }

        /* 해시태그 스타일 */
        .hashtag-container {
            margin-top: 16px;
        }

        .hashtag-input-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .hashtag-input {
            flex: 1;
        }

        .hashtag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .hashtag-item {
            background-color: rgba(49, 130, 206, 0.1);
            color: var(--toss-primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .hashtag-remove {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(49, 130, 206, 0.3);
            color: white;
            cursor: pointer;
            font-size: 10px;
        }

        /* 토스트 메시지 */
        .toss-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 20px;
            background-color: #2d3748;
            color: white;
            border-radius: var(--toss-radius);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 280px;
            max-width: 450px;
        }

        .toss-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toss-toast.success {
            background-color: #38a169;
        }

        .toss-toast.error {
            background-color: #e53e3e;
        }

        .toss-toast-icon {
            font-size: 18px;
        }

        .toss-toast-message {
            flex: 1;
            font-size: 14px;
        }

        /* 버튼 영역 */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--toss-border-color);
        }

        /* 마크다운 에디터 스타일 커스터마이징 */
        .editor-container {
            margin-top: 16px;
        }

        .CodeMirror {
            border-radius: 10px;
            border-color: #dfe3e8;
        }

        .CodeMirror-focused {
            border-color: var(--toss-primary);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        .editor-toolbar {
            border-radius: 10px 10px 0 0;
            border-color: #dfe3e8;
        }

        /* 마크다운 에디터 이미지 크기 제한 */
        .editor-preview img,
        .editor-preview-side img,
        .CodeMirror-preview img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        /* 에디터 내 이미지가 중앙 정렬되도록 */
        .editor-preview p:has(img),
        .editor-preview-side p:has(img) {
            text-align: center;
        }

        /* 임시 글 ID 배지 스타일 */
        .temp-post-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                padding: 16px;
            }

            .thumbnail-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<!-- 임시 글 ID 표시 배지 -->
<div class="temp-post-badge">
    <i class="fa fa-file-edit"></i>
    <span>임시 글 ID: <strong th:text="${id}">0</strong></span>
</div>

<div class="container">
    <h1 class="toss-page-title" th:text="${pageTitle}">새 포스트 작성</h1>

    <form id="post-form" onsubmit="submitPost(event)">
        <!-- 제목 입력 영역 -->
        <div class="toss-section">
            <div class="toss-card">
                <label for="post-title" class="toss-label">제목</label>
                <input
                        type="text"
                        id="post-title"
                        class="toss-input"
                        placeholder="제목을 입력하세요"
                        required
                        maxlength="100"
                        th:value="${title}">
            </div>
        </div>

        <!-- 썸네일 영역 -->
        <div class="toss-section">
            <div class="toss-section-title">
                <span>썸네일 이미지</span>
                <div class="toss-badge">필수</div>
            </div>

            <div class="toss-card">
                <div class="thumbnail-container">
                    <div id="thumbnail-preview">
                        <div class="no-thumbnail">썸네일 미리보기</div>
                    </div>
                    <div id="thumbnail-status">썸네일을 선택해주세요</div>
                </div>

                <!-- 이미지 갤러리 영역 -->
                <div id="image-gallery" class="image-gallery">
                    <div class="gallery-wrapper">
                        <button class="gallery-arrow gallery-arrow-left" id="gallery-prev" disabled>
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="gallery-container">
                            <div class="gallery-scroller"></div>
                        </div>
                        <button class="gallery-arrow gallery-arrow-right" id="gallery-next" disabled>
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 해시태그 입력 영역 -->
        <div class="toss-section">
            <div class="toss-section-title">해시태그</div>
            <div class="toss-card">
                <div class="hashtag-container">
                    <div class="hashtag-input-container">
                        <input
                                type="text"
                                id="hashtag-input"
                                class="toss-input hashtag-input"
                                placeholder="해시태그 입력 후 엔터"
                                maxlength="30">
                        <button type="button" id="add-hashtag" class="toss-btn toss-btn-secondary">추가</button>
                    </div>
                    <div id="hashtag-list" class="hashtag-list">
                        <!-- 해시태그가 여기에 추가됩니다 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 마크다운 에디터 영역 -->
        <div class="toss-section">
            <div class="toss-section-title">내용</div>
            <div class="toss-card">
                <div class="editor-container">
                    <textarea id="markdown-editor" th:text="${content}"></textarea>
                </div>
            </div>
        </div>

        <!-- 폼 액션 버튼 -->
        <div class="form-actions">
            <button type="button" class="toss-btn toss-btn-secondary" onclick="history.back()">취소</button>
            <button type="submit" id="submit-button" class="toss-btn toss-btn-primary">포스트 등록</button>
        </div>
    </form>
</div>

<!-- 토스트 메시지 -->
<div id="toast" class="toss-toast">
    <div class="toss-toast-icon"><i class="fas fa-info-circle"></i></div>
    <div class="toss-toast-message"></div>
</div>

<script th:inline="javascript">
    // 전역 변수 선언
    let editor;
    let thumbnailUrl = null;      // 선택된 썸네일 URL
    let uploadedUrls = [];        // 업로드된 모든 이미지 URL 배열
    let referenceId;
    let imageType;
    let maxFilesCount;
    let maxFileSizeMB;
    let maxFileSize;
    let allowedTypes;

    /**
     * 토스트 메시지 표시 함수
     * @param {string} message - 표시할 메시지
     * @param {string} type - 메시지 타입 (info, success, error)
     */
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const toastMessage = toast.querySelector('.toss-toast-message');
        const toastIcon = toast.querySelector('.toss-toast-icon i');

        // 아이콘 설정
        if (type === 'success') {
            toastIcon.className = 'fas fa-check-circle';
        } else if (type === 'error') {
            toastIcon.className = 'fas fa-exclamation-circle';
        } else {
            toastIcon.className = 'fas fa-info-circle';
        }

        toastMessage.textContent = message;
        toast.className = `toss-toast ${type} show`;

        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    /**
     * 마크다운 텍스트에서 이미지 URL 추출 함수
     * @param {string} markdownText - 마크다운 텍스트
     * @returns {Array} - 추출된 이미지 URL 배열
     */
    function extractImageUrls(markdownText) {
        const imageRegex = /!\[.*?\]\((https?:\/\/[^)]+)\)/g;
        const matches = Array.from(markdownText.matchAll(imageRegex));
        return matches.map(match => match[1]);
    }

    /**
     * 이미지를 썸네일로 설정하는 함수
     * @param {string} imageUrl - 썸네일로 설정할 이미지 URL
     */
    function setThumbnail(imageUrl) {
        thumbnailUrl = imageUrl;

        const thumbnailPreview = document.getElementById('thumbnail-preview');
        thumbnailPreview.innerHTML = '';
        thumbnailPreview.classList.add('has-image');

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'thumbnail-img-wrapper';

        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = '썸네일 이미지';

        imgWrapper.appendChild(img);
        thumbnailPreview.appendChild(imgWrapper);

        document.getElementById('thumbnail-status').textContent = '썸네일이 설정되었습니다';

        // 갤러리에서 해당 이미지에 썸네일 표시 업데이트
        document.querySelectorAll('.gallery-item').forEach(item => {
            if (item.dataset.url === imageUrl) {
                item.classList.add('is-thumbnail');
            } else {
                item.classList.remove('is-thumbnail');
            }
        });
    }

    /**
     * 갤러리 화살표 버튼 상태 업데이트
     */
    function updateArrowButtons() {
        const galleryContainer = document.querySelector('.gallery-container');
        const prevButton = document.getElementById('gallery-prev');
        const nextButton = document.getElementById('gallery-next');

        if (!galleryContainer || !prevButton || !nextButton) return;

        const scrollLeft = galleryContainer.scrollLeft;
        const maxScrollLeft = galleryContainer.scrollWidth - galleryContainer.clientWidth;

        prevButton.disabled = scrollLeft <= 0;
        nextButton.disabled = scrollLeft >= maxScrollLeft - 5; // 약간의 여유

        // 시각적 표시
        prevButton.style.opacity = prevButton.disabled ? '0.5' : '1';
        nextButton.style.opacity = nextButton.disabled ? '0.5' : '1';
    }

    document.addEventListener('DOMContentLoaded', function() {
        // 서버에서 전달된 설정값 로드
        referenceId = [[${id}]] || 1;
        imageType = [[${imageType}]] || 'POST';
        maxFilesCount = [[${maxImageCount}]] || 10;
        maxFileSizeMB = [[${maxFileSize}]] || 5;
        maxFileSize = maxFileSizeMB * 1024 * 1024; // MB를 바이트로 변환
        allowedTypes = ([[${allowedTypes}]] || 'image/jpeg, image/png, image/gif, image/webp').split(', ');

        console.log('설정 로드 완료:', {
            referenceId, imageType, maxFilesCount, maxFileSizeMB, allowedTypes
        });

        // =============================================
        // 1. 이미지 업로드 및 처리 함수
        // =============================================

        /**
         * 이미지 파일 유효성 검사
         * @param {File} file - 업로드할 이미지 파일
         * @returns {boolean} - 유효성 검사 통과 여부
         */
        function validateImageFile(file) {
            // 파일이 존재하고 이미지 타입인지 확인
            if (!file || !file.type.startsWith('image/')) {
                showToast('이미지 파일만 업로드할 수 있습니다.', 'error');
                return false;
            }

            // 허용된 이미지 타입인지 확인
            if (!allowedTypes.includes(file.type)) {
                showToast(`지원하지 않는 파일 형식입니다. 지원 형식: ${allowedTypes.join(', ')}`, 'error');
                return false;
            }

            // 파일 크기 제한 확인
            if (file.size > maxFileSize) {
                showToast(`파일 크기는 ${maxFileSizeMB}MB 이하여야 합니다.`, 'error');
                return false;
            }

            return true;
        }

        /**
         * Presigned URL 요청 함수
         * @param {string} fileExt - 파일 확장자
         * @returns {Promise<string>} - Presigned URL
         */
        async function requestPresignedUrl(fileExt) {
            try {
                const response = await fetch('/api/v1/images/presigned-url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        referenceId: referenceId,
                        imageType: imageType,
                        imageExtensions: [fileExt]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.msg || 'Presigned URL 생성 실패');
                }

                const result = await response.json();
                if (!result.data || !result.data.presignedUrls || result.data.presignedUrls.length === 0) {
                    throw new Error('유효하지 않은 응답 데이터');
                }

                return result.data.presignedUrls[0];
            } catch (error) {
                console.error('Presigned URL 요청 오류:', error);
                throw error;
            }
        }

        /**
         * S3에 이미지 업로드 함수
         * @param {string} presignedUrl - Presigned URL
         * @param {File} file - 업로드할 파일
         * @returns {Promise<void>}
         */
        async function uploadToS3(presignedUrl, file) {
            try {
                const uploadResponse = await fetch(presignedUrl, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': file.type
                    },
                    body: file
                });

                if (!uploadResponse.ok) {
                    throw new Error('S3 업로드 실패 (상태 코드: ' + uploadResponse.status + ')');
                }
            } catch (error) {
                console.error('S3 업로드 오류:', error);
                throw error;
            }
        }

        /**
         * 이미지 업로드 완료 후 DB에 정보 저장
         * @param {string} imageUrl - 업로드된 이미지 URL
         * @returns {Promise<boolean>} - 저장 성공 여부
         */
        async function completeUpload(imageUrl) {
            try {
                const response = await fetch('/api/v1/images/complete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: referenceId,
                        imageType: imageType,
                        imageUrl: [imageUrl]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.msg || '이미지 정보 저장 실패');
                }

                console.log('이미지 DB 저장 완료:', imageUrl);
                return true;
            } catch (error) {
                console.error('이미지 DB 저장 오류:', error);
                // DB 저장 실패해도 에디터에는 표시되도록 오류는 무시
                return false;
            }
        }

        /**
         * 이미지를 갤러리에 추가
         * @param {string} imageUrl - 갤러리에 추가할 이미지 URL
         */
        function addImageToGallery(imageUrl) {
            const galleryScroller = document.querySelector('.gallery-scroller');
            const imageGallery = document.getElementById('image-gallery');

            // 이미 갤러리에 있는지 확인
            const existingItem = Array.from(galleryScroller.children).find(item =>
                item.dataset.url === imageUrl);

            if (existingItem) {
                return; // 이미 있으면 추가하지 않음
            }

            // 갤러리 아이템 생성
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item';
            galleryItem.dataset.url = imageUrl;

            const img = document.createElement('img');
            img.src = imageUrl;
            img.alt = '업로드된 이미지';
            img.loading = 'lazy'; // 이미지 지연 로딩

            galleryItem.appendChild(img);
            galleryScroller.appendChild(galleryItem);

            // 갤러리 표시 상태 업데이트
            imageGallery.classList.add('has-images');

            // 썸네일로 설정하는 클릭 이벤트 추가
            galleryItem.addEventListener('click', function() {
                setThumbnail(imageUrl);
            });

            // 갤러리 화살표 상태 업데이트
            updateArrowButtons();
        }

        /**
         * 통합 이미지 업로드 핸들러
         * @param {File} file - 업로드할 이미지 파일
         * @returns {Promise<string|null>} - 업로드된 이미지 URL 또는 null
         */
        async function handleImageUpload(file) {
            console.log('이미지 업로드 시작:', file.name);

            try {
                // 1. 파일 유효성 검사
                if (!validateImageFile(file)) {
                    return null;
                }

                showToast('이미지 업로드 중...', 'info');

                // 2. 파일 확장자 추출
                const fileExt = file.name.split('.').pop().toLowerCase();

                // 3. Presigned URL 요청
                const presignedUrl = await requestPresignedUrl(fileExt);

                // Presigned URL에서 쿼리스트링 제거 (실제 이미지 URL)
                const imageUrl = presignedUrl.split('?')[0];

                console.log('Presigned URL 획득:', presignedUrl);
                console.log('실제 이미지 URL:', imageUrl);

                // 4. S3에 이미지 업로드
                await uploadToS3(presignedUrl, file);

                // 5. 업로드 완료 후 DB에 이미지 정보 저장
                await completeUpload(imageUrl);

                // 6. 썸네일이 없는 경우 첫 번째 이미지를 썸네일로 설정
                if (thumbnailUrl === null) {
                    setThumbnail(imageUrl);
                }

                // 7. 이미지 갤러리에 추가
                addImageToGallery(imageUrl);

                // 8. 업로드된 이미지 URL 목록에 추가
                uploadedUrls.push(imageUrl);

                showToast('이미지가 성공적으로 업로드되었습니다.', 'success');

                // 9. URL 반환
                return imageUrl;
            } catch (error) {
                console.error('이미지 업로드 오류:', error);
                showToast('이미지 업로드 중 오류가 발생했습니다: ' + error.message, 'error');
                return null;
            }
        }

        // =============================================
        // 2. 마크다운 에디터 초기화
        // =============================================

        /**
         * 마크다운 에디터 초기화
         */
        function initEditor() {
            const markdownEditor = new EasyMDE({
                element: document.getElementById('markdown-editor'),
                spellChecker: false,
                autofocus: false, // 자동 포커스 비활성화
                placeholder: '내용을 작성해주세요...',
                status: ['lines', 'words', 'cursor'],
                renderingConfig: {
                    codeSyntaxHighlighting: true,
                    markedOptions: {
                        breaks: true,
                        gfm: true
                    }
                },
                toolbar: [
                    'bold', 'italic', 'heading', '|',
                    'quote', 'code', 'unordered-list', 'ordered-list', '|',
                    'link', {
                        name: "custom-image",
                        action: function customImageFunction(editor){
                            // 파일 선택기 트리거
                            const fileInput = document.createElement('input');
                            fileInput.type = 'file';
                            fileInput.accept = 'image/*';
                            fileInput.style.display = 'none';
                            document.body.appendChild(fileInput);
                            
                            fileInput.addEventListener('change', function() {
                                if (fileInput.files && fileInput.files.length > 0) {
                                    // 이미지 업로드 상태 표시
                                    const placeholder = `![업로드 중...](업로드 중...)`;
                                    const cm = editor.codemirror;
                                    const cursorPos = cm.getCursor();
                                    cm.replaceSelection(placeholder);
                                    
                                    // 업로드 함수를 직접 호출하고 결과를 마크다운에 삽입
                                    handleImageUpload(fileInput.files[0]).then(url => {
                                        if (url) {
                                            // 현재 에디터 내용 가져오기
                                            const content = cm.getValue();
                                            // 업로드 중 표시를 실제 이미지로 교체
                                            const updatedContent = content.replace(placeholder, `![](${url})`);
                                            // 새 내용으로 에디터 업데이트
                                            cm.setValue(updatedContent);
                                            console.log('에디터에 이미지 URL 삽입 완료:', url);
                                        }
                                    });
                                }
                                // 사용 후 파일 입력 요소 제거
                                document.body.removeChild(fileInput);
                            });
                            
                            fileInput.click();
                        },
                        className: "fa fa-image",
                        title: "이미지 업로드",
                    },
                    'table', '|',
                    'preview', 'side-by-side', 'fullscreen', '|',
                    'guide'
                ],
                // 중요: EasyMDE의 기본 이미지 업로드 기능 비활성화
                uploadImage: false,
                // 기본 이미지 업로드 기능 대신 커스텀 이미지 버튼만 사용
                imageUploadFunction: undefined
            });
            
            // 이미지 크기 조정을 위한 스타일 추가
            const styleElement = document.createElement('style');
            styleElement.textContent = `
                .CodeMirror img, .editor-preview img {
                    max-width: 100%;
                    max-height: 400px;
                }
            `;
            document.head.appendChild(styleElement);
            
            // 드래그 앤 드롭 이미지 업로드 지원
            const cm = markdownEditor.codemirror;
            cm.on('drop', (editor, event) => {
                const dataTransfer = event.dataTransfer;
                if (dataTransfer && dataTransfer.files && dataTransfer.files.length) {
                    const files = Array.from(dataTransfer.files).filter(file => 
                        file.type.startsWith('image/'));
                    
                    if (files.length > 0) {
                        event.preventDefault();
                        
                        // 각 이미지 파일 처리
                        files.forEach(file => {
                            // 이미지 업로드 상태 표시
                            const placeholder = `![업로드 중...](업로드 중...)`;
                            editor.replaceSelection(placeholder);
                            
                            // 업로드 처리
                            handleImageUpload(file).then(url => {
                                if (url) {
                                    // 현재 에디터 내용 가져오기
                                    const content = editor.getValue();
                                    // 업로드 중 표시를 실제 이미지로 교체
                                    const updatedContent = content.replace(placeholder, `![](${url})`);
                                    // 새 내용으로 에디터 업데이트
                                    editor.setValue(updatedContent);
                                    console.log('드래그 앤 드롭: 에디터에 이미지 URL 삽입 완료:', url);
                                }
                            });
                        });
                    }
                }
            });
            
            // 붙여넣기 이미지 업로드 지원
            document.addEventListener('paste', function(e) {
                if (!markdownEditor.codemirror.hasFocus()) return;
                
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        e.preventDefault();
                        
                        const file = items[i].getAsFile();
                        const placeholder = `![업로드 중...](업로드 중...)`;
                        markdownEditor.codemirror.replaceSelection(placeholder);
                        
                        handleImageUpload(file).then(url => {
                            if (url) {
                                const content = markdownEditor.value();
                                const updatedContent = content.replace(placeholder, `![](${url})`);
                                markdownEditor.value(updatedContent);
                                console.log('붙여넣기: 에디터에 이미지 URL 삽입 완료:', url);
                            }
                        });
                        
                        break;
                    }
                }
            });
            
            return markdownEditor;
        }
        
        // =============================================
        // 3. 해시태그 기능 초기화
        // =============================================
        
        /**
         * 해시태그 추가 기능 설정
         */
        function setupHashtags() {
            const hashtagInput = document.getElementById('hashtag-input');
            const addHashtagButton = document.getElementById('add-hashtag');
            const hashtagList = document.getElementById('hashtag-list');
            
            // 해시태그 추가 함수
            function addHashtag() {
                const tagText = hashtagInput.value.trim();
                if (!tagText) return;
                
                // 해시태그 중복 검사
                const existingTags = Array.from(hashtagList.children).map(
                    tag => tag.dataset.tag || tag.textContent.replace('#', '').trim()
                );
                
                if (existingTags.includes(tagText)) {
                    showToast('이미 추가된 해시태그입니다.', 'error');
                    return;
                }
                
                // 해시태그 요소 생성
                const tagItem = document.createElement('div');
                tagItem.className = 'hashtag-item';
                tagItem.dataset.tag = tagText;
                tagItem.innerHTML = `#${tagText} <span class="hashtag-remove">×</span>`;
                
                // 삭제 버튼 이벤트 추가
                tagItem.querySelector('.hashtag-remove').addEventListener('click', function() {
                    hashtagList.removeChild(tagItem);
                });
                
                hashtagList.appendChild(tagItem);
                hashtagInput.value = '';
            }
            
            // 버튼 클릭 및 엔터키 처리
            addHashtagButton.addEventListener('click', addHashtag);
            hashtagInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addHashtag();
                }
            });
        }
        
        // =============================================
        // 4. 갤러리 설정
        // =============================================
        
        /**
         * 이미지 갤러리 설정
         */
        function setupGallery() {
            const galleryContainer = document.querySelector('.gallery-container');
            const prevButton = document.getElementById('gallery-prev');
            const nextButton = document.getElementById('gallery-next');
            
            if (!galleryContainer || !prevButton || !nextButton) return;
            
            // 좌우 스크롤 기능
            prevButton.addEventListener('click', () => {
                galleryContainer.scrollBy({ left: -300, behavior: 'smooth' });
            });
            
            nextButton.addEventListener('click', () => {
                galleryContainer.scrollBy({ left: 300, behavior: 'smooth' });
            });
            
            // 스크롤 이벤트 감지하여 화살표 상태 업데이트
            galleryContainer.addEventListener('scroll', () => {
                updateArrowButtons();
            });
            
            // 초기 화살표 상태 설정
            updateArrowButtons();
        }
        
        // =============================================
        // 5. 초기화 및 이벤트 설정
        // =============================================
        
        // 마크다운 에디터 초기화 - 전역 변수에 할당
        editor = initEditor();
        
        // 해시태그 기능 초기화
        setupHashtags();
        
        // 갤러리 설정
        setupGallery();
        
        // 임시글 ID 표시 (작게 출력)
        const referenceIdElement = document.getElementById('reference-id');
        if (referenceIdElement) {
            referenceIdElement.textContent = `임시글 ID: ${referenceId}`;
        }
    });
    
    /**
     * 포스트 등록 함수 - 폼 제출 시 호출됨
     * @param {Event} event - 폼 제출 이벤트
     */
    async function submitPost(event) {
        event.preventDefault();
        
        // 폼 데이터 수집
        const title = document.getElementById('post-title').value.trim();
        const content = editor.value(); // 마크다운 에디터 내용
        
        // 유효성 검사
        if (!title) {
            showToast('제목을 입력해주세요.', 'error');
            return;
        }
        
        if (!content || content.trim().length < 10) {
            showToast('내용은 최소 10자 이상 입력해주세요.', 'error');
            return;
        }
        
        // 이미지 URL 수집 (에디터에서 추출 + 갤러리에 있는 이미지)
        const contentImageUrls = extractImageUrls(content);
        const allImageUrls = [...new Set([...uploadedUrls, ...contentImageUrls])];
        
        // 썸네일 URL 확인
        if (!thumbnailUrl && allImageUrls.length > 0) {
            thumbnailUrl = allImageUrls[0]; // 첫 번째 이미지를 썸네일로 사용
            console.log('자동으로 첫 번째 이미지를 썸네일로 설정:', thumbnailUrl);
        }
        
        if (!thumbnailUrl) {
            showToast('썸네일 이미지를 선택해주세요.', 'error');
            return;
        }
        
        // 해시태그 수집 및 DTO 형태로 변환
        const hashtagElements = document.querySelectorAll('.hashtag-item');
        const hashtags = Array.from(hashtagElements).map(el => {
            const tagText = el.dataset.tag || el.textContent.replace('#', '').trim();
            // HashtagDto 객체 형태로 변환
            return {
                name: tagText  // HashtagDto의 필드명을 'name'으로 가정 (백엔드 구현에 맞게 조정)
            };
        });
        
        // 해시태그가 없으면 기본 해시태그 추가
        if (hashtags.length === 0) {
            hashtags.push({ name: "스팟파인더" });
        }
        
        // 제출 버튼 비활성화 및 로딩 표시
        const submitButton = document.getElementById('submit-button');
        const originalButtonText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = '저장 중...';
        
        try {
            // LocationDto에 맞는 장소 정보 생성 (배열로 생성)
            const locations = [
                {
                    name: "스팟파인더 카페",
                    address: "서울특별시 강남구 테헤란로 123",
                    latitude: 37.4967,
                    longitude: 127.0254,
                    sequence: 1  // 필수 필드: 1~20 사이의 값
                }
            ];
            
            // POST 요청 데이터 준비 - 백엔드 DTO 구조에 정확히 맞춤
            const postData = {
                title: title,
                content: content,
                thumbnail: thumbnailUrl,  // 'thumbnailUrl'이 아닌 'thumbnail'로 변경
                hashtags: hashtags,
                locations: locations     // 'location'이 아닌 'locations' 배열로 변경
            };
            
            console.log('제출할 포스트 데이터:', postData);
            
            // 개발 환경 확인
            const isDevelopment = window.location.hostname === 'localhost' || 
                                 window.location.hostname === '127.0.0.1';
            
            // 헤더 준비
            let headers = {
                'Content-Type': 'application/json'
            };
            
            // 개발 환경에서는 JWT 토큰 획득하여 인증 헤더 추가
            if (isDevelopment) {
                try {
                    // 개발용 테스트 토큰 획득 (사용자 ID 1번 사용)
                    const tokenResponse = await fetch('/api/v1/dev/token/1');
                    if (tokenResponse.ok) {
                        const tokenData = await tokenResponse.json();
                        if (tokenData.data && tokenData.data.token) {
                            // 획득한 JWT 토큰을 Authorization 헤더에 추가
                            headers['Authorization'] = `Bearer ${tokenData.data.token}`;
                            console.log('개발용 JWT 토큰이 발급되었습니다.');
                        }
                    } else {
                        console.warn('개발용 JWT 토큰 획득 실패:', await tokenResponse.text());
                    }
                } catch (tokenError) {
                    console.error('개발용 토큰 요청 중 오류:', tokenError);
                    // 토큰 획득 실패해도 계속 진행 (JwtFilter에서 쿠키 인증 시도 가능성)
                }
            }
            
            // API 요청 전 최종 유효성 검사
            if (!postData.thumbnail) {
                throw new Error('썸네일 이미지는 필수입니다.');
            }
            
            if (!postData.locations || postData.locations.length === 0) {
                throw new Error('최소 하나 이상의 장소가 필요합니다.');
            }
            
            // API 요청
            const response = await fetch('/api/v1/posts', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(postData)
            });
            
            // 응답 처리
            if (!response.ok) {
                let errorMessage = '포스트 저장 중 오류가 발생했습니다';
                try {
                    const errorData = await response.json();
                    if (errorData.message) {
                        errorMessage = errorData.message;
                    } else if (errorData.data) {
                        errorMessage = JSON.stringify(errorData.data);
                    }
                } catch (e) {
                    // JSON 파싱 오류 무시하고 기본 메시지 사용
                }
                throw new Error(errorMessage);
            }
            
            const result = await response.json();
            console.log('포스트 저장 성공:', result);
            
            // 성공 메시지를 alert로 표시하고 확인 후 페이지 새로고침
            alert('포스트가 성공적으로 등록되었습니다.');
            window.location.reload();
        } catch (error) {
            console.error('포스트 등록 오류:', error);
            showToast(error.message || '포스트 등록 중 오류가 발생했습니다.', 'error');
        } finally {
            // 버튼 상태 복원
            submitButton.disabled = false;
            submitButton.textContent = originalButtonText;
        }
    }
</script>
